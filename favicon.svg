<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="48%" r="72%"><stop offset="0" stop-color="#12163a"/><stop offset="1" stop-color="#06080f"/></radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0a0c1a" stop-opacity="0"/><stop offset=".45" stop-color="#0d1030" stop-opacity=".8"/>
      <stop offset=".74" stop-color="#4a3fd8" stop-opacity=".9"/><stop offset=".92" stop-color="#8f84ff" stop-opacity=".45"/><stop offset="1" stop-color="#8f84ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" values="0 0 0 0 .95  0 0 0 0 .92  0 0 0 0 1  0 0 0 1.5 -.55"/></filter>
    <path id="heart" d="M32 49.500C15.500 38.500 13.500 26.500 21 22.500c4.600-2.300 8.800.400 11 4.200 2.200-3.800 6.400-6.500 11-4.200 7.500 4 5.500 16-11 27z"/>
