    <circle cx="32" cy="32" r="30" fill="url(#orb)"/>
    <use href="#heart" fill="none" stroke="#ff6aa8" stroke-width="5" opacity=".7" filter="url(#glow)"/>
    <use href="#heart" fill="rgba(255,120,170,.10)" stroke="#6f62ff" stroke-width="3.2" stroke-linejoin="round" transform="translate(-1.600 .6)" opacity=".95"/>
    <use href="#heart" fill="none" stroke="#ff4b5c" stroke-width="3.2" stroke-linejoin="round" transform="translate(1.600 -.4)" opacity=".9"/>
